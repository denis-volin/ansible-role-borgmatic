---
# defaults file for borgmatic

borgmatic_borg_version: 1.4.5
borgmatic_borg_url: https://github.com/borgbackup/borg/releases/download/{{ borgmatic_borg_version }}/borg-linux-glibc235-x86_64-gh

borgmatic_uv_version: 0.13.9
borgmatic_uv_url: https://github.com/astral-sh/uv/releases/download/{{ borgmatic_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz

borgmatic_version: 2.2.0

borgmatic_source_directories:
  - /etc
  - /home
  - /opt
  - /root
  - /srv
  - /var
borgmatic_repositories: []
borgmatic_exclude_patterns:
  - '/var/cache'
  - '/var/tmp'
  - '/var/run'
  - '/var/lock'
borgmatic_exclude_caches: true
borgmatic_encryption_passphrase: ""
borgmatic_keep_daily: 7
borgmatic_keep_weekly: 4
borgmatic_keep_monthly: 12
borgmatic_checks:
  - name: repository
    frequency: 2 weeks
  - name: archives
    frequency: 1 month
borgmatic_check_last: 3

borgmatic_timer_hour: 3
borgmatic_timer_minute: 0
