---
# handlers file for borgmatic
- name: Validate borgmatic config
  ansible.builtin.command:
    cmd: /usr/local/bin/borgmatic -c /etc/borgmatic/config.yaml config validate
  changed_when: false

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart systemd timer
  ansible.builtin.systemd:
    name: borgmatic.timer
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"
